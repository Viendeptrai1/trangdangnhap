services:
  postgres:
    image: postgres:15-alpine
    container_name: trangdangnhap-postgres
    hostname: postgres
    environment:
      - POSTGRES_DB=DBUser
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - trangdangnhap-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d DBUser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Java Web Application
  webapp:
    build: .
    container_name: trangdangnhap-webapp
    ports:
      - "8080:8080"
    networks:
      - trangdangnhap-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=DBUser
      - DB_USER=postgres
      - DB_PASSWORD=postgres123

volumes:
  postgres_data:
    driver: local

networks:
  trangdangnhap-network:
    driver: bridge
